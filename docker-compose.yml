services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 3s
      timeout: 3s
      retries: 10

  downstream:
    build: .
    command: uvicorn downstream.main:app --host 0.0.0.0 --port 9000
    environment:
      DOWNSTREAM_BASE_MS: "300"
      DOWNSTREAM_JITTER_MS: "500"
      DOWNSTREAM_SPIKE_PROB: "0.05"
    ports:
      - "9000:9000"

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/app
      DOWNSTREAM_URL: http://downstream:9000
      # The fault switch. Set to "true" to run the FIXED version.
      FIX_ENABLED: "${FIX_ENABLED:-false}"
      DB_POOL_SIZE: "5"
      DB_MAX_OVERFLOW: "0"
      DB_POOL_TIMEOUT: "5"
      LOG_LEVEL: "INFO"
    ports:
      - "8000:8000"

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_SECURITY_ADMIN_PASSWORD: "admin"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
